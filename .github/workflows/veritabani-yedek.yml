name: Haftalik Veritabani Yedegi

on:
  schedule:
    - cron: '0 3 * * 1'   # Her Pazartesi 03:00 UTC (Turkiye saatiyle 06:00)
  workflow_dispatch:       # Actions sekmesinden elle de calistirilabilir

jobs:
  yedek-al:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu checkout et
        uses: actions/checkout@v4

      - name: PostgreSQL istemcisini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Veritabanini yedekle
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p yedekler
          TARIH=$(date +%Y-%m-%d)
          pg_dump "$DATABASE_URL" --no-owner --no-privileges > "yedekler/yedek_${TARIH}.sql"
          gzip "yedekler/yedek_${TARIH}.sql"

      - name: Eski yedekleri temizle (son 12 haftayi tut)
        run: |
          cd yedekler
          ls -t *.sql.gz 2>/dev/null | tail -n +13 | xargs -r rm --

      - name: Degisiklikleri commitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yedekler/
          git diff --staged --quiet && echo "Degisiklik yok, commit atlanidi" || git commit -m "Otomatik veritabani yedegi $(date +%Y-%m-%d)"
          git push
