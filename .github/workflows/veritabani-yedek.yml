name: Gunluk Veritabani Yedegi
on:
  schedule:
    - cron: '0 3 * * *'   # Her gun 03:00 UTC (Turkiye saatiyle 06:00)
  workflow_dispatch:       # Actions sekmesinden elle de calistirilabilir
jobs:
  yedek-al:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu checkout et
        uses: actions/checkout@v4
      - name: PostgreSQL 17 istemcisini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Veritabanini yedekle
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p yedekler
          TARIH=$(date +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges > "yedekler/yedek_${TARIH}.sql"
          gzip "yedekler/yedek_${TARIH}.sql"
      - name: Eski yedekleri temizle (son 30 gunu tut)
        run: |
          cd yedekler
          ls -t *.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm --
      - name: Degisiklikleri commitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yedekler/
          git diff --staged --quiet && echo "Degisiklik yok, commit atlanidi" || git commit -m "Otomatik veritabani yedegi $(date +%Y-%m-%d)"
          git push
